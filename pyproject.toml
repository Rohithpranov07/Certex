[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "certex"
version = "1.0.0"
description = "A complexity-certifying regular-expression compiler"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "hypothesis>=6.100,<7", "mypy>=1.10", "ruff>=0.5"]
engines = ["pcre2==0.7.1"]
figures = ["matplotlib>=3.8,<4"]

[project.scripts]
certex = "certex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: long-running tests (engine replay, performance guards)"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*"]
ignore_missing_imports = true
